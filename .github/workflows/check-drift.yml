name: Check Drift

# A package can carry the same version as the one on npm and still ship different
# code, which no version comparison can see. This diffs the real publishable
# artifact — the `npm pack` tarball — against the published one, on every change.
#
# It runs on Linux while releases are cut on macOS, so it doubles as the
# cross-machine reproducibility check.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: check-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Test the gate itself
        run: npm run test:scripts
      - name: Compare every public package against its published tarball
        run: npm run check:drift
