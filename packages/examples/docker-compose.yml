services:
  postgres:
    image: postgres:16-alpine
    container_name: cnstra-examples-pg
    environment:
      POSTGRES_USER: cnstra
      POSTGRES_PASSWORD: cnstra
      POSTGRES_DB: cnstra
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cnstra']
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: cnstra-examples-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
